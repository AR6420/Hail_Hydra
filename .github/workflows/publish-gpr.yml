name: Publish to npm & GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --ignore-scripts

      # prepack runs `npm run build && npm test` — dist/ is generated fresh
      # and gated by the test suite before anything is published.
      - name: Publish to npm
        run: |
          if npm publish; then
            echo 'Published.'
          elif npm view "hail-hydra-cc@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo 'Version already published to npm — skipping.'
          else
            echo 'PUBLISH FAILED (auth? check NPM_TOKEN secret)' >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Scope package for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@ar6420/hail-hydra-cc';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com/' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to GitHub Packages
        run: |
          if npm publish; then
            echo 'Published.'
          elif npm view "@ar6420/hail-hydra-cc@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo 'Version already published to GitHub Packages — skipping.'
          else
            echo 'PUBLISH FAILED (auth? check GITHUB_TOKEN permissions)' >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
